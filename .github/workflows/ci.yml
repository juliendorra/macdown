name: Check MacDown and optional Mac app
run-name: "MacDown · ${{ github.ref_name }} · ${{ inputs.apple_build && 'Mac app' || 'portable checks' }}"
on:
  workflow_dispatch:
    inputs:
      apple_build:
        description: Run all native, GUI, memory and rendering tests; build the universal app (uses macOS minutes)
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths: ['MacDown/**', 'MacDownTests/**', 'Dependency/**', 'Tests/**', 'Scripts/**', 'Tools/**', 'MacDown.xcodeproj/**', 'macdown-cmd/**', 'Gemfile*', 'Podfile*', '.github/workflows/**', '.gitignore', '.gitleaks*']
  pull_request:
    paths: ['MacDown/**', 'MacDownTests/**', 'Dependency/**', 'Tests/**', 'Scripts/**', 'Tools/**', 'MacDown.xcodeproj/**', 'macdown-cmd/**', 'Gemfile*', 'Podfile*', '.github/workflows/**', '.gitignore', '.gitleaks*']
permissions:
  contents: read
concurrency:
  group: macdown-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: .build/test-tools
          key: macdown-test-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/check-secrets.py') }}
      - run: python3 Scripts/test_pipeline.py portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MacDown-portable-tests-${{ github.run_number }}
          path: Artifacts/Tests/
          if-no-files-found: error
          retention-days: 7
  macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apple_build }}
    needs: portable
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: macdown-pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Podfile.lock', 'Podfile') }}
      - uses: actions/cache@v4
        with:
          path: .build/test-tools
          key: macdown-test-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/check-secrets.py') }}
      - name: Build once and run the complete Mac test pipeline
        run: caffeinate -d -i -u python3 Scripts/test_pipeline.py full --portable-checked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MacDown-macOS-${{ github.run_number }}
          path: |
            Artifacts/MacDown-macOS.zip
            Artifacts/MacDown.xcresult
            Artifacts/MacDown-unverified.zip
            Artifacts/Diagnostics/
            Artifacts/Tests/
          if-no-files-found: warn
          retention-days: 3
